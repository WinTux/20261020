spring.application.name=ejemplo01springboot
server.port=7001
mensaje.saludo=Hola a todos
# para exponer otros endpoint incluyendo shutdown
management.endpoints.web.exposure.include=shutdown,startup,loggers,info,health
# habilitar actuator shutdown
management.endpoint.shutdown.enabled=true
# Habilitar debug
debug=false
# Hablando de logs
logging.file.path=/home/rusok/Descargas/logs_eliminables
logging.file.name=/home/rusok/Descargas/logs_eliminables/proy-spring.log
# Inicio de rotacion
logging.level.org.springframework=INFO
logging.level.com.pepe.ejemplo01springboot=TRACE
# Patron de nombre de archivo para la rotacion
logging.logback.rollingpolicy.file-name-pattern=ejemplo01springboot-%d{yyyy-MM-dd}-%i.log
logging.logback.rollingpolicy.max-file-size=100KB
